# App
spring.application.name=coreops-finance

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/coreops
spring.datasource.username=coreops
spring.datasource.password=coreops123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Vaadin
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.coreops