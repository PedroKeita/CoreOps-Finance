# App
spring.application.name=coreops-finance

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coreops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coreops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coreops123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.coreops

# JWT
jwt.secret=${JWT_SECRET:3cF8kP2mX9qL5nR7vT1wA6dY4uZ0bJ}
jwt.expiration=${JWT_EXPIRATION:86400000}